name: verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build && npm run build:host
        working-directory: web
      - shell: bash
        run: mkdir -p internal/webassets/dist/host && cp -R web/dist/. internal/webassets/dist/ && cp -R web/dist-host/. internal/webassets/dist/host/
      - run: go vet ./cmd/... ./internal/... ./plugins/...
      - run: go test -race ./cmd/... ./internal/... ./plugins/...
      - shell: bash
        run: CGO_ENABLED=0 go build -buildvcs=false -trimpath -ldflags='-s -w' -o enhanced-kimi${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/enhanced-kimi
      - shell: bash
        run: python3 scripts/acceptance.py --binary ./enhanced-kimi${{ runner.os == 'Windows' && '.exe' || '' }}
  crossbuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci && npm run build && npm run build:host
        working-directory: web
      - run: python3 scripts/test_package.py && python3 scripts/test_sync_cnb_release.py
      - run: mkdir -p internal/webassets/dist/host && cp -R web/dist/. internal/webassets/dist/ && cp -R web/dist-host/. internal/webassets/dist/host/ && sh scripts/crossbuild.sh && python3 scripts/notices.py && python3 scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-binaries
          path: dist/
