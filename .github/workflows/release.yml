name: Release KimiCode+

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional version confirmation matching the selected release tag'
        required: false
        type: string
      skip_cnb_mirror:
        description: 'Skip the CNB domestic mirror sync for this run (leaves it on the previous version)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Fail before building anything: the draft release and the CNB mirror must be
      # updated together, so a missing CNB_TOKEN has to stop the run while the tag
      # still has no release and no mirror entry.
      - name: Require CNB_TOKEN unless the mirror is explicitly skipped
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          SKIP_CNB_MIRROR: ${{ inputs.skip_cnb_mirror || 'false' }}
        run: |
          if [ "$SKIP_CNB_MIRROR" = "true" ]; then
            echo 'skip_cnb_mirror=true: this run will not touch the CNB mirror.'
            exit 0
          fi
          if [ -z "${CNB_TOKEN:-}" ]; then
            echo 'CNB_TOKEN secret is not configured. Add the secret, or re-run with skip_cnb_mirror=true if the mirror is intentionally left on the previous release.' >&2
            exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and build the frontend
        working-directory: web
        run: npm ci && npm run typecheck && npm test && npm run build && npm run build:host
      - name: Embed frontend assets
        run: |
          rm -rf internal/webassets/dist
          mkdir -p internal/webassets/dist/host
          cp -R web/dist/. internal/webassets/dist/
          cp -R web/dist-host/. internal/webassets/dist/host/
      - name: Verify the core
        run: go vet ./... && go test ./...
      - name: Resolve release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import os
          import sys

          sys.path.insert(0, 'scripts')
          from package import release_version

          tag = os.environ['GITHUB_REF_NAME']
          if os.environ['GITHUB_REF_TYPE'] != 'tag' or not tag.startswith('v'):
              raise SystemExit('Select an existing v-prefixed release tag for this workflow')
          version = release_version(tag)
          value = os.environ.get('INPUT_VERSION')
          if value and release_version(value) != version:
              raise SystemExit('The specified version does not match the selected tag')
          # A SemVer pre-release identifier after the patch (0.2.1-rc.1,
          # 0.2.1-beta.2) must publish as a GitHub pre-release: it is not the
          # stable build that normal users are offered as "latest".
          prerelease = '-' in version.split('+', 1)[0]
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              print(f'version={version}', file=output)
              print(f'prerelease={"true" if prerelease else "false"}', file=output)
          PY
      - name: Verify release packaging
        run: |
          python3 scripts/test_package.py
          python3 scripts/test_sync_cnb_release.py
      - name: Prepare release metadata
        run: |
          echo "RELEASE_PUBLISHED_AT=$(git log -1 --format=%cI)" >> "$GITHUB_ENV"
          {
            echo 'RELEASE_NOTES<<__EKD_RELEASE_NOTES__'
            git log -1 --format=%B
            echo '__EKD_RELEASE_NOTES__'
          } >> "$GITHUB_ENV"
      # `repos/{repo}/releases/tags/{tag}` answers 404 for drafts, so a run
      # interrupted after the draft upload would look like "no release" and the
      # next attempt would append a second copy of the notes to the same draft.
      # `gh release view` sees drafts, so use it for the existence check.
      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_draft=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null || echo unknown)
            echo "A release already exists for $GITHUB_REF_NAME (draft=$is_draft)." >&2
            if [ "$is_draft" = "false" ]; then
              echo 'The published release is never overwritten. Use a new version to publish.' >&2
            else
              echo 'It is a draft left by an interrupted run. Delete it first: gh release delete "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag=false, then re-run this workflow.' >&2
            fi
            exit 1
          fi
      - name: Cross-build and package
        env:
          VER: ${{ steps.version.outputs.version }}
        run: |
          VERSION="$VER" sh scripts/crossbuild.sh
          python3 scripts/notices.py
          python3 scripts/package.py --version "$VER"
      # Upload every archive, SHA256SUMS, manifest.json and the notices file into a
      # draft first: a draft release is not mapped by releases/latest, so no client
      # can see a release while its archives are still uploading. Publishing is a
      # separate step once the asset list is complete.
      - name: Upload release assets to a draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ github.repository }}
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/release/*.tar.gz
            dist/release/*.zip
            dist/release/SHA256SUMS
            dist/release/manifest.json
            dist/THIRD_PARTY_NOTICES.txt
      - name: Sync release to CNB mirror
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_REPO: wssz527/kimicode-plus
          TAG: v${{ steps.version.outputs.version }}
          IS_PRERELEASE: ${{ steps.version.outputs.prerelease }}
          SKIP_CNB_MIRROR: ${{ inputs.skip_cnb_mirror || 'false' }}
        run: |
          if [ "$SKIP_CNB_MIRROR" = "true" ]; then
            echo 'skip_cnb_mirror=true: CNB mirror sync explicitly skipped for this run.'
            exit 0
          fi
          if [ -z "${CNB_TOKEN:-}" ]; then
            echo 'CNB_TOKEN secret is not configured. The domestic CNB mirror would stay on the previous release, so this run fails instead of reporting success.' >&2
            echo 'Configure the secret, sync manually with scripts/sync_cnb_release.py, or re-run with skip_cnb_mirror=true.' >&2
            echo 'The GitHub release stays a draft until this step succeeds; the tag cannot be published by a plain re-run until that draft is deleted or published.' >&2
            exit 1
          fi
          extra=""
          if [ "$IS_PRERELEASE" = "true" ]; then
            extra="--prerelease"
          fi
          python3 scripts/sync_cnb_release.py \
            --tag "$TAG" \
            --repo "$CNB_REPO" \
            $extra \
            dist/release/*.tar.gz \
            dist/release/*.zip \
            dist/release/SHA256SUMS \
            dist/release/manifest.json \
            dist/THIRD_PARTY_NOTICES.txt
      # Publishing comes last: the draft is only made public once every asset is
      # uploaded and the CNB mirror carries the same files. A failure before this
      # point leaves the release in draft, so releases/latest never points at a
      # partially uploaded release on either source.
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --latest is explicit: a pre-release must never become "latest", and a
          # stable release must become it even when the tag was created earlier.
          gh release edit "v${{ steps.version.outputs.version }}" \
            --repo "${{ github.repository }}" \
            --draft=false \
            --latest=${{ steps.version.outputs.prerelease != 'true' }}
